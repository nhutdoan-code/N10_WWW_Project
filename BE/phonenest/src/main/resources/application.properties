spring.application.name=phonenest
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.datasource.url=jdbc:mariadb://localhost:3306/BanDienThoai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:sapassword}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SPRING SECURITY
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT
# DEVELOPMENT FALLBACK ONLY
app.jwt.secret=${JWT_SECRET:phonenest-dev-only-secret-key-nhom10-lap-trinh-www-java-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=uploads

app.cors.origin=http://localhost:5173


# ==========================================
# SPRING AI - GEMINI CHAT
# ==========================================

spring.ai.model.chat=google-genai

# Gemini API Key - Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini model
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Temperature
spring.ai.google.genai.chat.options.temperature=0.7


# ==========================================
# SPRING AI - OLLAMA EMBEDDING
# ==========================================

spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}

spring.ai.ollama.embedding.model=${OLLAMA_MODEL:bge-m3}

# Gi?m retry khi ki?m tra Gemini
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false
spring.ai.retry.exclude-on-http-codes=400,401,403,404

# ==========================================
# EMAIL OTP / NOTIFICATION
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}

spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:}

spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${APP_MAIL_FROM:no-reply@phonenest.vn}

app.frontend-url=http://localhost:5173


# ==========================================
# USER TRACKING
# ==========================================

app.tracking.retention-days=${TRACKING_RETENTION_DAYS:90}


# ==========================================
# MOMO TEST PAYMENT
# ==========================================

momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}

momo.partner-code=${MOMO_PARTNER_CODE:}

momo.access-key=${MOMO_ACCESS_KEY:}

momo.secret-key=${MOMO_SECRET_KEY:}

momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/orders}

momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}
