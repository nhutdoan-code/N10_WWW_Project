spring.application.name=phonenest
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

spring.datasource.url=jdbc:mariadb://localhost:3306/BanDienThoai
spring.datasource.username=root
spring.datasource.password=sapassword

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT - DEVELOPMENT FALLBACK ONLY.
# Production MUST set JWT_SECRET (>= 32 bytes) and JWT_EXPIRATION (milliseconds) via environment.
app.jwt.secret=${JWT_SECRET:phonenest-dev-only-secret-key-nhom10-lap-trinh-www-java-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads
app.cors.origin=http://localhost:5173

spring.ai.openai.api-key=${OPENAI_API_KEY:chua-cau-hinh}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0

# Gửi email thật (tuỳ chọn): bỏ comment và điền SMTP. Nếu không, nội dung email được ghi ra log.
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your@gmail.com
# spring.mail.password=app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@phonenest.vn
app.frontend-url=http://localhost:5173

# MoMo test credentials. Set these environment variables before enabling VI_DIEN_TU.
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/orders}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}

# AI Embedding - Local Pretrained Ollama Engine
phonenest.ai.embedding.provider=ollama
phonenest.ai.embedding.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
phonenest.ai.embedding.ollama.model=${OLLAMA_EMBEDDING_MODEL:bge-m3}
phonenest.ai.embedding.dimensions=1024

