spring.application.name=phonenest
# Gia tri cuc bo (mat khau, secret) dat trong BE/phonenest/application-local.properties (da gitignore).
# Mau: application-local.properties.example
spring.config.import=optional:file:./application-local.properties
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/BanDienThoai}
spring.datasource.username=${DB_USERNAME:root}
# Khong ghi mat khau vao repository: dat bien moi truong DB_PASSWORD hoac application-local.properties
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SPRING SECURITY
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT
# DEVELOPMENT FALLBACK ONLY
# Bat buoc cau hinh (>= 32 ky tu) qua bien moi truong JWT_SECRET hoac application-local.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=uploads

app.cors.origin=http://localhost:5173


# ==========================================
# SPRING AI - GEMINI CHAT
# ==========================================

spring.ai.model.chat=google-genai

# Gemini API Key - Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini model
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}

# Temperature
spring.ai.google.genai.chat.options.temperature=0.7


# ==========================================
# SPRING AI - OLLAMA EMBEDDING
# ==========================================

spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}

spring.ai.ollama.embedding.model=${OLLAMA_MODEL:bge-m3}

# Gi?m retry khi ki?m tra Gemini
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false
spring.ai.retry.exclude-on-http-codes=400,401,403,404

# ==========================================
# EMAIL OTP / NOTIFICATION
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}

spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:}

spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${APP_MAIL_FROM:no-reply@phonenest.vn}

app.frontend-url=http://localhost:5173


# ==========================================
# USER TRACKING
# ==========================================

app.tracking.retention-days=${TRACKING_RETENTION_DAYS:90}


# ==========================================
# MOMO TEST PAYMENT
# ==========================================

momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}

momo.partner-code=${MOMO_PARTNER_CODE:}

momo.access-key=${MOMO_ACCESS_KEY:}

momo.secret-key=${MOMO_SECRET_KEY:}

momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/orders}

momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}
# Phe duyet ban hang (2B.7C): tach quyen 4 mat - Admin vua mo khoa khong duoc tu phe duyet.
# Mac dinh tat vi hien chi co mot tai khoan Admin. Bat bang APPROVAL_SEPARATION_OF_DUTIES=true.
app.approval.tach-quyen-mo-khoa-va-duyet=${APPROVAL_SEPARATION_OF_DUTIES:false}
# 2B.7D: READ COMMITTED. MariaDB >= 11.6 bat innodb_snapshot_isolation: o REPEATABLE READ, SELECT ... FOR UPDATE
# tren dong vua bi giao dich khac doi bao loi "Record has changed since last read" -> don hang song song tren cung
# bien the that bai hang loat. Tinh dung dan dua tren khoa dong (FOR UPDATE) + ma kiem tra sau khi khoa.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
